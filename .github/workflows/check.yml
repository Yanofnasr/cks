# SPDX-License-Identifier: MIT
name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation and JSON fixtures
        run: python3 scripts/check.py
      - name: Test the repository checker
        run: python3 -m unittest discover -s tests -v
      - name: Test the compiled image example
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: go test labs/fixtures/image-go/main.go labs/fixtures/image-go/main_test.go
