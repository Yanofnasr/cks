# Training allowlist. A registry name is not proof of image publisher/signature.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cks-allowed-registries
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          c.image.startsWith('docker.io/') || c.image.startsWith('registry.k8s.io/'))
      message: "Ordinary container images must use an allowed registry prefix."
    - expression: >-
        !has(object.spec.initContainers) || object.spec.initContainers.all(c,
          c.image.startsWith('docker.io/') || c.image.startsWith('registry.k8s.io/'))
      message: "Init container images must use an allowed registry prefix."
    - expression: >-
        !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
          c.image.startsWith('docker.io/') || c.image.startsWith('registry.k8s.io/'))
      message: "Ephemeral container images must use an allowed registry prefix."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cks-allowed-registries
spec:
  policyName: cks-allowed-registries
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        cks-practice: admission
