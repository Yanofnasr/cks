# Deliberately unhardened starting point for MW02 and RT03.
apiVersion: v1
kind: Pod
metadata:
  name: demo
  namespace: cks-lab
  labels:
    app: demo
spec:
  containers:
  - name: app
    image: docker.io/library/busybox:1.37
    command:
    - sh
    - -c
    - mkdir -p /tmp/www; printf "cks-practice\n" > /tmp/www/index.html; exec httpd
      -f -p 8080 -h /tmp/www
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 1
      periodSeconds: 2
  volumes:
  - name: tmp
    emptyDir: {}
