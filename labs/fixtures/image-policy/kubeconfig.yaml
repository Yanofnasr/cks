# SPDX-License-Identifier: MIT
apiVersion: v1
kind: Config
clusters:
  - name: image-policy
    cluster:
      server: https://127.0.0.1:8443
      certificate-authority: /etc/kubernetes/cks-image-policy/ca.crt
users:
  - name: image-policy-client
    user:
      client-certificate: /etc/kubernetes/cks-image-policy/client.crt
      client-key: /etc/kubernetes/cks-image-policy/client.key
contexts:
  - name: image-policy
    context:
      cluster: image-policy
      user: image-policy-client
current-context: image-policy
