# SPDX-License-Identifier: MIT
# Pod omits automountServiceAccountToken so the ServiceAccount default is exercised.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ch02-client
  namespace: cks-lab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ch02-pod-reader
  namespace: cks-lab
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ch02-pod-reader
  namespace: cks-lab
subjects:
- kind: ServiceAccount
  name: ch02-client
  namespace: cks-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ch02-pod-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: ch02-client
  namespace: cks-lab
  labels:
    role: client
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: client
    image: docker.io/library/busybox:1.37
    command:
    - sleep
    - '86400'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
  serviceAccountName: ch02-client
