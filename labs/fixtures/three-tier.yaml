# SPDX-License-Identifier: MIT
# HTTP witnesses for traffic policy, not a database application.
apiVersion: v1
kind: Namespace
metadata:
  name: cks-tiers
  labels:
    purpose: cks-practice
---
apiVersion: v1
kind: Namespace
metadata:
  name: cks-data
  labels:
    purpose: cks-practice
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: cks-tiers
  labels:
    tier: frontend
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/library/busybox:1.37
    command:
    - sleep
    - '86400'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: cks-tiers
  labels:
    tier: backend
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/library/busybox:1.37
    command:
    - sh
    - -c
    - mkdir -p /tmp/www; printf "backend-witness\n" > /tmp/www/index.html; exec httpd
      -f -p 8080 -h /tmp/www
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    ports:
    - containerPort: 8080
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 1
      periodSeconds: 2
  volumes:
  - name: tmp
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cks-tiers
spec:
  selector:
    tier: backend
  ports:
  - port: 8080
    targetPort: 8080
---
